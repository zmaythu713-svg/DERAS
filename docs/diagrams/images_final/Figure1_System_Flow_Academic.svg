<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1586" viewBox="0 0 920 1586">
  <rect width="920" height="1586" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <text x="460" y="36" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Figure 1: System Flow Diagram</text>
<text x="460" y="56" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Web-Based Education Resource Allocation and Inventory Management System (DERAS)</text>
<rect x="120" y="78" width="680" height="290" rx="14" ry="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="136" y="100" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#334155">1. Authentication</text>
<ellipse cx="460" cy="126" rx="58" ry="18" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
  <text x="460" y="131" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Start</text>
<line x1="460" y1="144" x2="460" y2="166" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="330" y="184" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="207" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">User Login</text>
<line x1="460" y1="220" x2="460" y2="240" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<path d="M460,220 L570,262 L460,304 L350,262 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
  <text x="460" y="258" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">Is the user</text>
  <text x="460" y="274" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">authenticated?</text>
<text x="338" y="258" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">No</text>
<line x1="350" y1="262" x2="250" y2="262" stroke="#1f2937" stroke-width="1.45"/>
<line x1="250" y1="262" x2="250" y2="184" stroke="#1f2937" stroke-width="1.45"/>
<line x1="250" y1="184" x2="330" y2="184" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<text x="578" y="258" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">Yes</text>
<line x1="460" y1="304" x2="460" y2="326" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="330" y="344" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="367" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Access System Dashboard</text>
<line x1="460" y1="380" x2="460" y2="396" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="120" y="384" width="680" height="250" rx="14" ry="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="136" y="406" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#334155">2. Master Data Management</text>
<rect x="330" y="432" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="455" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Manage Academic Years</text>
<line x1="460" y1="468" x2="460" y2="486" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="330" y="502" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="525" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Manage Townships / Grades / Subjects</text>
<line x1="460" y1="538" x2="460" y2="556" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="330" y="572" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="595" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Manage Book Names / Contacts</text>
<line x1="460" y1="608" x2="460" y2="662" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="90" y="650" width="740" height="320" rx="14" ry="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="106" y="672" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#334155">3. Inventory Management</text>
<rect x="330" y="698" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="721" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Update Stock / Supplies / Teacher Guides</text>
<line x1="460" y1="734" x2="460" y2="754" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<path d="M460,734 L570,776 L460,818 L350,776 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
  <text x="460" y="772" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">Is sufficient</text>
  <text x="460" y="788" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">stock available?</text>
<text x="578" y="772" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">No</text>
<line x1="570" y1="776" x2="710" y2="776" stroke="#1f2937" stroke-width="1.45"/>
<line x1="710" y1="776" x2="710" y2="834" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="610" y="834" width="200" height="40" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="710" y="846" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">Request / Adjust</text><text x="710" y="862" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">Inventory</text>
<line x1="710" y1="874" x2="710" y2="716" stroke="#1f2937" stroke-width="1.45"/>
<line x1="710" y1="716" x2="590" y2="716" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<text x="338" y="772" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">Yes</text>
<line x1="460" y1="818" x2="460" y2="840" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="330" y="866" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="889" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Confirm Inventory Readiness</text>
<line x1="460" y1="902" x2="460" y2="998" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="90" y="986" width="740" height="340" rx="14" ry="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="106" y="1008" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#334155">4. Resource Allocation</text>
<rect x="330" y="1034" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="1057" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Enter Student Quota</text>
<line x1="460" y1="1070" x2="460" y2="1088" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="330" y="1104" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="1127" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Create Allocation Plan</text>
<line x1="460" y1="1140" x2="460" y2="1160" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<path d="M460,1140 L570,1182 L460,1224 L350,1182 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
  <text x="460" y="1178" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">Is the allocation</text>
  <text x="460" y="1194" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">approved?</text>
<text x="338" y="1178" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">No</text>
<line x1="350" y1="1182" x2="210" y2="1182" stroke="#1f2937" stroke-width="1.45"/>
<line x1="210" y1="1182" x2="210" y2="1240" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="110" y="1240" width="200" height="40" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="210" y="1252" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">Revise Allocation</text><text x="210" y="1268" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">Plan</text>
<line x1="210" y1="1280" x2="210" y2="1122" stroke="#1f2937" stroke-width="1.45"/>
<line x1="210" y1="1122" x2="330" y2="1122" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<text x="578" y="1178" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111827">Yes</text>
<line x1="460" y1="1224" x2="460" y2="1246" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="330" y="1272" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="1295" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Distribute Resources to Townships</text>
<line x1="460" y1="1308" x2="460" y2="1354" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="120" y="1342" width="680" height="230" rx="14" ry="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="136" y="1364" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#334155">5. Reporting</text>
<rect x="330" y="1390" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="1413" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Generate / Export Reports (XLSX)</text>
<line x1="460" y1="1426" x2="460" y2="1444" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<rect x="330" y="1460" width="260" height="36" rx="10" ry="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="460" y="1483" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">Logout</text>
<line x1="460" y1="1496" x2="460" y2="1518" stroke="#1f2937" stroke-width="1.45" marker-end="url(#arrow)"/>
<ellipse cx="460" cy="1538" rx="50" ry="18" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
  <text x="460" y="1543" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111827">End</text>
</svg>