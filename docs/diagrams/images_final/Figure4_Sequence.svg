<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740">
  <rect width="1000" height="740" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Figure 4: Sequence Diagram - Create Allocation Plan</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#000"/></marker>
  </defs>

  <g font-family="Arial" font-size="12">
    <circle cx="80" cy="70" r="10" fill="none" stroke="#000"/>
    <line x1="80" y1="80" x2="80" y2="105" stroke="#000"/>
    <line x1="65" y1="90" x2="95" y2="90" stroke="#000"/>
    <line x1="80" y1="105" x2="68" y2="120" stroke="#000"/>
    <line x1="80" y1="105" x2="92" y2="120" stroke="#000"/>
    <text x="80" y="138" text-anchor="middle">Admin</text>
    <line x1="80" y1="145" x2="80" y2="700" stroke="#000" stroke-dasharray="3,3"/>

    <rect x="190" y="60" width="120" height="40" fill="#fff" stroke="#000"/>
    <text x="250" y="85" text-anchor="middle">Login / UI</text>
    <line x1="250" y1="100" x2="250" y2="700" stroke="#000" stroke-dasharray="3,3"/>

    <rect x="370" y="55" width="160" height="50" fill="#fff" stroke="#000"/>
    <text x="450" y="75" text-anchor="middle">AllocationPlan</text>
    <text x="450" y="93" text-anchor="middle">Controller</text>
    <line x1="450" y1="105" x2="450" y2="700" stroke="#000" stroke-dasharray="3,3"/>

    <rect x="580" y="55" width="140" height="50" fill="#fff" stroke="#000"/>
    <text x="650" y="75" text-anchor="middle">Allocation</text>
    <text x="650" y="93" text-anchor="middle">Calculator</text>
    <line x1="650" y1="105" x2="650" y2="700" stroke="#000" stroke-dasharray="3,3"/>

    <rect x="800" y="60" width="120" height="40" fill="#fff" stroke="#000"/>
    <text x="860" y="85" text-anchor="middle">Database</text>
    <line x1="860" y1="100" x2="860" y2="700" stroke="#000" stroke-dasharray="3,3"/>
  </g>

  <g font-family="Arial" font-size="12" fill="#000">
    <line x1="80" y1="170" x2="250" y2="170" stroke="#000" marker-end="url(#a)"/>
    <text x="165" y="164" text-anchor="middle">1. Open Create Form</text>

    <line x1="80" y1="210" x2="250" y2="210" stroke="#000" marker-end="url(#a)"/>
    <text x="165" y="204" text-anchor="middle">2. Enter plan data</text>

    <line x1="250" y1="250" x2="450" y2="250" stroke="#000" marker-end="url(#a)"/>
    <text x="350" y="244" text-anchor="middle">3. POST /allocation-plans</text>

    <line x1="450" y1="290" x2="530" y2="290" stroke="#000"/>
    <line x1="530" y1="290" x2="530" y2="320" stroke="#000"/>
    <line x1="530" y1="320" x2="450" y2="320" stroke="#000" marker-end="url(#a)"/>
    <text x="560" y="310">4. Validate + year check</text>

    <line x1="450" y1="360" x2="650" y2="360" stroke="#000" marker-end="url(#a)"/>
    <text x="550" y="354" text-anchor="middle">5. compute()</text>

    <line x1="650" y1="400" x2="450" y2="400" stroke="#000" stroke-dasharray="4,3" marker-end="url(#a)"/>
    <text x="550" y="394" text-anchor="middle">6. plan + township values</text>

    <line x1="450" y1="440" x2="860" y2="440" stroke="#000" marker-end="url(#a)"/>
    <text x="655" y="434" text-anchor="middle">7. BEGIN</text>

    <line x1="450" y1="480" x2="860" y2="480" stroke="#000" marker-end="url(#a)"/>
    <text x="655" y="474" text-anchor="middle">8. INSERT allocation_plans</text>

    <line x1="450" y1="520" x2="860" y2="520" stroke="#000" marker-end="url(#a)"/>
    <text x="655" y="514" text-anchor="middle">9. INSERT allocation_plan_townships</text>

    <line x1="450" y1="560" x2="860" y2="560" stroke="#000" marker-end="url(#a)"/>
    <text x="655" y="554" text-anchor="middle">10. Sync textbooks</text>

    <line x1="450" y1="600" x2="860" y2="600" stroke="#000" marker-end="url(#a)"/>
    <text x="655" y="594" text-anchor="middle">11. COMMIT</text>

    <line x1="450" y1="640" x2="250" y2="640" stroke="#000" stroke-dasharray="4,3" marker-end="url(#a)"/>
    <text x="350" y="634" text-anchor="middle">12. Redirect success</text>

    <line x1="250" y1="680" x2="80" y2="680" stroke="#000" stroke-dasharray="4,3" marker-end="url(#a)"/>
    <text x="165" y="674" text-anchor="middle">13. Show list</text>
  </g>
</svg>
