    <line x1="790" y1="1090" x2="820" y2="1090" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="820" y="1070" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="895" y="1095" text-anchor="middle">Export XLSX</text>
    <line x1="970" y1="1090" x2="1040" y2="1090" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- TG Receipt + Export -->
    <line x1="450" y1="1150" x2="500" y2="1150" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="500" y="1130" width="290" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="645" y="1155" text-anchor="middle">Manage Teacher Guide Receipt</text>
    <line x1="790" y1="1150" x2="820" y2="1150" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="820" y="1130" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="895" y="1155" text-anchor="middle">Export XLSX</text>
    <line x1="970" y1="1150" x2="1040" y2="1150" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- TG Distribution + Export -->
    <line x1="450" y1="1210" x2="500" y2="1210" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="500" y="1190" width="290" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="645" y="1215" text-anchor="middle">Manage Teacher Guide Distribution</text>
    <line x1="790" y1="1210" x2="820" y2="1210" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="820" y="1190" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="895" y="1215" text-anchor="middle">Export XLSX</text>
    <line x1="970" y1="1210" x2="1040" y2="1210" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- TG Issues + Export -->
    <line x1="450" y1="1270" x2="500" y2="1270" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="500" y="1250" width="290" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="645" y="1275" text-anchor="middle">Manage Teacher Guide Issues</text>
    <line x1="790" y1="1270" x2="820" y2="1270" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="820" y="1250" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="895" y="1275" text-anchor="middle">Export XLSX</text>
    <line x1="970" y1="1270" x2="1040" y2="1270" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- TG Summaries + Export -->
    <line x1="450" y1="1330" x2="500" y2="1330" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="500" y="1310" width="290" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="645" y="1335" text-anchor="middle">Manage Teacher Guide Summaries</text>
    <line x1="790" y1="1330" x2="820" y2="1330" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="820" y="1310" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="895" y="1335" text-anchor="middle">Export XLSX</text>
    <line x1="970" y1="1330" x2="1040" y2="1330" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

    <line x1="450" y1="1390" x2="500" y2="1390" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="500" y="1370" width="290" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="645" y="1395" text-anchor="middle">Manage Company Contacts</text>
    <line x1="790" y1="1390" x2="1040" y2="1390" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

    <line x1="450" y1="1450" x2="500" y2="1450" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="500" y="1430" width="290" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="645" y="1455" text-anchor="middle">Manage Admin Users (Super)</text>
    <line x1="790" y1="1450" x2="1040" y2="1450" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

    <line x1="450" y1="1510" x2="500" y2="1510" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="500" y="1490" width="290" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="645" y="1515" text-anchor="middle">Manage Profile</text>
    <line x1="790" y1="1510" x2="1040" y2="1510" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

    <line x1="450" y1="1570" x2="500" y2="1570" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="500" y="1550" width="290" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="645" y="1575" text-anchor="middle">Logout</text>
    <line x1="790" y1="1570" x2="1040" y2="1570" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Collector -> Stop -->
  <line x1="1040" y1="1580" x2="1040" y2="1650" stroke="#000" stroke-width="1.5"/>
  <line x1="1040" y1="1650" x2="645" y2="1650" stroke="#000" stroke-width="1.5"/>
  <line x1="645" y1="1650" x2="645" y2="1685" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <ellipse cx="645" cy="1715" rx="50" ry="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="645" y="1720" text-anchor="middle" font-family="Arial" font-size="14">Stop</text>
