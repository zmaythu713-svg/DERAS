<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1180" viewBox="0 0 1100 1180">
  <rect width="1100" height="1180" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Figure 2: Use Case Diagram for DERAS</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- System boundary -->
  <rect x="180" y="55" width="720" height="1090" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="200" y="80" font-family="Arial" font-size="15" font-weight="bold">DERAS System</text>

  <!-- Admin actor (left) -->
  <g transform="translate(90,560)" font-family="Arial" font-size="13">
    <circle cx="0" cy="-30" r="12" fill="none" stroke="#000" stroke-width="1.6"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#000" stroke-width="1.6"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#000" stroke-width="1.6"/>
    <line x1="0" y1="18" x2="-14" y2="40" stroke="#000" stroke-width="1.6"/>
    <line x1="0" y1="18" x2="14" y2="40" stroke="#000" stroke-width="1.6"/>
    <text x="0" y="62" text-anchor="middle">Admin</text>
  </g>

  <!-- Super Admin actor (right) -->
  <g transform="translate(1010,560)" font-family="Arial" font-size="13">
    <circle cx="0" cy="-30" r="12" fill="none" stroke="#000" stroke-width="1.6"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#000" stroke-width="1.6"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#000" stroke-width="1.6"/>
    <line x1="0" y1="18" x2="-14" y2="40" stroke="#000" stroke-width="1.6"/>
    <line x1="0" y1="18" x2="14" y2="40" stroke="#000" stroke-width="1.6"/>
    <text x="0" y="62" text-anchor="middle">Super Admin</text>
  </g>

  <!-- Main vertical use-case column -->
  <g font-family="Arial" font-size="12" fill="#000">
    <ellipse cx="400" cy="115" rx="125" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="119" text-anchor="middle">Login</text>
    <ellipse cx="400" cy="165" rx="125" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="169" text-anchor="middle">View Dashboard</text>
    <ellipse cx="400" cy="215" rx="135" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="219" text-anchor="middle">Manage Academic Years</text>
    <ellipse cx="400" cy="265" rx="125" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="269" text-anchor="middle">Manage Townships</text>
    <ellipse cx="400" cy="315" rx="140" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="319" text-anchor="middle">Manage Grades / Subjects</text>
    <ellipse cx="400" cy="365" rx="125" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="369" text-anchor="middle">Manage Book Names</text>
    <ellipse cx="400" cy="415" rx="130" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="419" text-anchor="middle">Manage Student Quota</text>
    <ellipse cx="400" cy="465" rx="140" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="469" text-anchor="middle">Manage Allocation Plans</text>
    <ellipse cx="400" cy="515" rx="125" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="519" text-anchor="middle">Manage Textbooks</text>
    <ellipse cx="400" cy="565" rx="115" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="569" text-anchor="middle">Manage Stocks</text>
    <ellipse cx="400" cy="615" rx="140" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="619" text-anchor="middle">Manage School Supplies</text>
    <ellipse cx="400" cy="665" rx="135" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="669" text-anchor="middle">Manage Supply Details</text>
    <ellipse cx="400" cy="715" rx="155" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="719" text-anchor="middle">Manage Teacher Guide Receipt</text>
    <ellipse cx="400" cy="765" rx="165" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="769" text-anchor="middle">Manage Teacher Guide Distribution</text>
    <ellipse cx="400" cy="815" rx="155" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="819" text-anchor="middle">Manage Teacher Guide Issues</text>
    <ellipse cx="400" cy="865" rx="160" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="869" text-anchor="middle">Manage Teacher Guide Summaries</text>
    <ellipse cx="400" cy="915" rx="145" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="919" text-anchor="middle">Manage Company Contacts</text>
    <ellipse cx="400" cy="965" rx="120" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="969" text-anchor="middle">Manage Profile</text>
    <ellipse cx="400" cy="1015" rx="95" ry="18" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="400" y="1019" text-anchor="middle">Logout</text>

    <!-- Right-side include / extend targets -->
    <ellipse cx="720" cy="215" rx="120" ry="20" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <text x="720" y="220" text-anchor="middle">Rollover Academic Year</text>

    <ellipse cx="720" cy="450" rx="115" ry="22" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <text x="720" y="446" text-anchor="middle">Calculate Township</text>
    <text x="720" y="462" text-anchor="middle">Allocation</text>

    <ellipse cx="720" cy="520" rx="120" ry="20" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <text x="720" y="525" text-anchor="middle">Sync Textbook from Plan</text>

    <ellipse cx="720" cy="965" rx="115" ry="20" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <text x="720" y="970" text-anchor="middle">Manage Admin Users</text>
  </g>

  <!-- Admin association lines (fan) -->
  <g stroke="#000" stroke-width="1" fill="none">
    <line x1="108" y1="560" x2="275" y2="115"/>
    <line x1="108" y1="560" x2="275" y2="165"/>
    <line x1="108" y1="560" x2="265" y2="215"/>
    <line x1="108" y1="560" x2="275" y2="265"/>
    <line x1="108" y1="560" x2="260" y2="315"/>
    <line x1="108" y1="560" x2="275" y2="365"/>
    <line x1="108" y1="560" x2="270" y2="415"/>
    <line x1="108" y1="560" x2="260" y2="465"/>
    <line x1="108" y1="560" x2="275" y2="515"/>
    <line x1="108" y1="560" x2="285" y2="565"/>
    <line x1="108" y1="560" x2="260" y2="615"/>
    <line x1="108" y1="560" x2="265" y2="665"/>
    <line x1="108" y1="560" x2="245" y2="715"/>
    <line x1="108" y1="560" x2="235" y2="765"/>
    <line x1="108" y1="560" x2="245" y2="815"/>
    <line x1="108" y1="560" x2="240" y2="865"/>
    <line x1="108" y1="560" x2="255" y2="915"/>
    <line x1="108" y1="560" x2="280" y2="965"/>
    <line x1="108" y1="560" x2="305" y2="1015"/>
  </g>

  <!-- Super Admin associations (few only, like sample Student) -->
  <g stroke="#000" stroke-width="1" fill="none">
    <line x1="992" y1="560" x2="840" y2="215"/>
    <line x1="992" y1="560" x2="840" y2="965"/>
    <line x1="992" y1="560" x2="535" y2="215"/>
    <line x1="992" y1="560" x2="535" y2="465"/>
  </g>

  <!-- <<include>> / <<extends>> dashed arrows -->
  <g stroke="#000" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)">
    <!-- Rollover includes Manage Academic Years -->
    <line x1="600" y1="215" x2="535" y2="215"/>
    <!-- Allocation Plan includes Calculate -->
    <line x1="540" y1="465" x2="605" y2="455"/>
    <!-- Textbooks includes Sync -->
    <line x1="525" y1="515" x2="600" y2="520"/>
    <!-- Summaries includes Distribution -->
    <line x1="400" y1="847" x2="400" y2="783"/>
    <!-- Issues includes Distribution -->
    <path d="M555,815 L620,815 L620,765 L565,765"/>
    <!-- Distribution includes Receipt -->
    <line x1="400" y1="747" x2="400" y2="733"/>
  </g>
  <g font-family="Arial" font-size="10" fill="#000">
    <text x="555" y="208">&lt;&lt;include&gt;&gt;</text>
    <text x="545" y="448">&lt;&lt;include&gt;&gt;</text>
    <text x="545" y="505">&lt;&lt;include&gt;&gt;</text>
    <text x="310" y="820">&lt;&lt;include&gt;&gt;</text>
    <text x="625" y="790">&lt;&lt;include&gt;&gt;</text>
    <text x="310" y="742">&lt;&lt;include&gt;&gt;</text>
  </g>
</svg>
